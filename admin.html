<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寄せ書き 管理・印刷プレビュー</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --text: #202124;
      --muted: #6b7280;
      --line: #dde3ea;
      --accent: #243041;
      --shadow: 0 10px 28px rgba(0,0,0,0.08);
    }
    html, body {
      margin: 0;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .top-card {
      background: var(--surface);
      border-radius: 18px;
      padding: 22px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 5vw, 34px);
    }
    .intro {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.8;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
      align-items: end;
    }
    .field {
      grid-column: span 12;
    }
    .field.half {
      grid-column: span 6;
    }
    .field.third {
      grid-column: span 4;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }
    input, select, button {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 700;
    }
    button.secondary {
      background: #64748b;
    }
    button.ghost {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .actions button {
      width: auto;
      padding: 0 16px;
    }
    .status {
      margin-top: 14px;
      min-height: 24px;
      line-height: 1.6;
      color: #b42318;
      white-space: pre-wrap;
    }
    .summary {
      margin-top: 10px;
      color: var(--muted);
    }

    .individual-panel {
      background: var(--surface);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .individual-panel[hidden] {
      display: none !important;
    }
    .individual-panel h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .individual-panel .panel-note {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }
    .individual-list {
      display: grid;
      gap: 8px;
    }
    .individual-row {
      display: grid;
      grid-template-columns: 70px minmax(100px, 160px) 1fr 150px;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .individual-number {
      color: var(--muted);
      font-size: 13px;
    }
    .individual-name {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .individual-message {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }
    .individual-row select {
      min-height: 38px;
      padding: 7px 10px;
    }
    @media (max-width: 720px) {
      .individual-row {
        grid-template-columns: 56px 1fr 130px;
      }
      .individual-message {
        grid-column: 2 / -1;
        grid-row: 2;
      }
    }

    .preview-wrap {
      display: grid;
      gap: 18px;
    }
    .page-block {
      background: transparent;
    }
    .page-title {
      margin: 0 0 8px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 700;
    }
    .print-page {
      width: 210mm;
      min-height: 297mm;
      background: #fff;
      box-shadow: var(--shadow);
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      page-break-after: always;
    }
    .print-grid {
      position: absolute;
      inset: 0;
      padding: var(--page-margin-mm);
      display: grid;
      grid-template-columns: repeat(var(--grid-cols), var(--card-width-mm));
      grid-auto-rows: var(--card-height-mm);
      justify-content: center;
      align-content: start;
      gap: var(--grid-gap-mm);
    }
    .oval-card {
      width: var(--card-width-mm);
      height: var(--card-height-mm);
      background: #fff;
      border: 5.2px solid var(--oval-color);
      border-radius: 9999px;
      overflow: hidden;
      padding: 7mm 8mm 6mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .message-area {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .message-text {
      width: 100%;
      margin: 0;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      font-size: 11pt;
    }
    .name-line {
      flex: 0 0 auto;
      margin-top: 4mm;
      text-align: right;
      font-size: 9pt;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .note {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
    }
    @media (max-width: 980px) {
      .field.half, .field.third { grid-column: span 12; }
      .print-page {
        width: 100%;
        min-height: auto;
        aspect-ratio: 210 / 297;
      }
    }
    @media print {
      body {
        background: #fff;
      }
      .top-card,
      .individual-panel {
        display: none !important;
      }
      .shell {
        max-width: none;
        padding: 0;
      }
  
    .individual-panel {
      background: var(--surface);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .individual-panel[hidden] {
      display: none !important;
    }
    .individual-panel h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .individual-panel .panel-note {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }
    .individual-list {
      display: grid;
      gap: 8px;
    }
    .individual-row {
      display: grid;
      grid-template-columns: 70px minmax(100px, 160px) 1fr 150px;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .individual-number {
      color: var(--muted);
      font-size: 13px;
    }
    .individual-name {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .individual-message {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }
    .individual-row select {
      min-height: 38px;
      padding: 7px 10px;
    }
    @media (max-width: 720px) {
      .individual-row {
        grid-template-columns: 56px 1fr 130px;
      }
      .individual-message {
        grid-column: 2 / -1;
        grid-row: 2;
      }
    }

    .preview-wrap {
        gap: 0;
      }
      .page-title {
        display: none;
      }
      .print-page {
        width: 210mm;
        min-height: 297mm;
        box-shadow: none;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="top-card">
      <h1>管理・印刷プレビュー</h1>
      <p class="intro">
        スプレッドシートに保存されたメッセージを読み込み、A4印刷用のオーバルカードを自動配置します。<br>
        初期サイズを3種類から選べます。さらに、読み込み後は<strong>メッセージごとに個別サイズ変更</strong>できます。
      </p>

      <div class="controls">
        <div class="field half">
          <label for="gasUrl">Google Apps Script のウェブアプリURL</label>
          <input id="gasUrl" type="text" placeholder="https://script.google.com/macros/s/.../exec">
        </div>

        <div class="field half">
          <label for="adminKey">管理用キー</label>
          <input id="adminKey" type="password" placeholder="Apps Script側で設定した管理用キー">
        </div>

        <div class="field third">
          <label for="sizePreset">初期オーバルサイズ</label>
          <select id="sizePreset">
            <option value="small">小（70mm × 45mm）</option>
            <option value="medium" selected>中（80mm × 50mm）</option>
            <option value="large">大（85mm × 55mm）</option>
          </select>
        </div>

        <div class="field third">
          <label for="pageMargin">ページ余白</label>
          <select id="pageMargin">
            <option value="8">狭め（8mm）</option>
            <option value="10" selected>標準（10mm）</option>
            <option value="12">広め（12mm）</option>
          </select>
        </div>

        <div class="field third">
          <label for="gridGap">カード間隔</label>
          <select id="gridGap">
            <option value="5">狭め（5mm）</option>
            <option value="6" selected>標準（6mm）</option>
            <option value="8">広め（8mm）</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="loadButton" type="button">メッセージを読み込む</button>
        <button id="rerenderButton" type="button" class="secondary">プレビューを更新</button>
        <button id="printButton" type="button" class="ghost">印刷する</button>
        <button id="clearButton" type="button" class="ghost">保存済み設定を消去</button>
      </div>

      <div id="status" class="status" aria-live="polite"></div>
      <div id="summary" class="summary"></div>
      <p class="note">
        ※ 管理用キーは、この管理画面でのみ使用します。<br>
        ※ 印刷時はブラウザの「印刷」から、そのまま紙出力またはPDF保存ができます。
      </p>
    </section>

    <section id="individualPanel" class="individual-panel" hidden>
      <h2>個別サイズ設定</h2>
      <p class="panel-note">
        各メッセージごとに「小・中・大」を選べます。変更すると印刷プレビューも自動更新されます。
      </p>
      <div id="individualList" class="individual-list"></div>
    </section>

    <section id="previewWrap" class="preview-wrap"></section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
